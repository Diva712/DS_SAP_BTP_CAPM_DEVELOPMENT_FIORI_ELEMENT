# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"

metadata:
  name: ds.sales.salesorder

type: application

framework:
  name: SAPUI5
  version: "1.153.0"

  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.fe.templates
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: dssalessalesorder
        relativePaths: true
        additionalFiles:
          - xs-app.json
